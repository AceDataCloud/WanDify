identity:
  author: acedatacloud
  name: wan
  label:
    en_US: Wan
    zh_Hans: Wan
    ja_JP: Wan
    pt_BR: Wan
  description:
    en_US: Use the Ace Data Cloud Wan APIs in Dify workflows.
    zh_Hans: 在 Dify 工作流中使用 Ace Data Cloud Wan API。
  icon: icon.png
  icon_dark: icon.png
  tags:
  - videos
credentials_for_provider:
